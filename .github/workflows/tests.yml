# Fast checks that need nothing but bash - kept out of build-selftest.yml so a
# change to lib/ does not also queue the multi-minute source builds.
#
# What they guard is small and consequential: the rules that decide whether a
# fixer action can leave Nightfall's boot entry with the wrong panel settings,
# on a tablet where a dark Nightfall needs a keyboard to escape. Each refusal
# rule has a case where it alone refuses, so deleting one fails the suite.
name: tests

on:
  push:
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'fixes/nightfall/**'
      - 'bin/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  boot-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Nightfall boot-entry safety checks
        run: ./tests/test-nightfall-boot-safety.sh
      - name: Nightfall backup housekeeping checks
        run: ./tests/test-nightfall-backups.sh
      - name: Kernel listing, removal guards and default
        run: ./tests/test-kernels.sh
      - name: Nightfall install detection (touchscreen, marker, GRUB)
        run: ./tests/test-nightfall-detect.sh
      - name: Nightfall apply auto-fix (checkout clone, missing packages)
        run: ./tests/test-nightfall-apply-deps.sh
      - name: Updater (git fast-forward rules, kernel version comparison)
        run: ./tests/test-updates.sh
      - name: EC button delivery (firmware-fixed-IRQ standdown, double-keypress guard)
        run: ./tests/test-ec-buttons.sh
      - name: Panel brightness AUX (kernel-drives-it standdown is informative, not a refusal)
        run: ./tests/test-panel-brightness-aux.sh
      - name: audio-avs-dsp cmdline (unreadable /proc/cmdline must never read as "absent")
        run: ./tests/test-audio-avs-dsp-cmdline.sh
      - name: Waydroid LXC hook (post-stop fix + proc/cmdline containment)
        run: ./tests/test-waydroid-lxc-hook.sh
      - name: Machine Specs display (friendly model name, matching unaffected)
        run: ./tests/test-registry.py
