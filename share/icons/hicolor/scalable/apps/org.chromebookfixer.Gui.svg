<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- SPDX-License-Identifier: GPL-3.0-or-later
       chromebook-fixer application icon: the device, and the tool acting on it.
       Warm amber on cool slate on purpose - this icon sits in a shelf of
       blue-grey settings icons and has to be findable among them. Drawn so the
       wrench still carries the shape at 16px, where the screen behind it stops
       being a screen and becomes texture. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42557a"/>
      <stop offset="1" stop-color="#1c2536"/>
    </linearGradient>
    <!-- Open-end spanner: ring, minus its bore, minus the jaw notch. -->
    <mask id="wrench">
      <rect width="128" height="128" fill="#000"/>
      <circle cx="64" cy="40" r="18" fill="#fff"/>
      <rect x="57" y="40" width="14" height="52" rx="7" fill="#fff"/>
      <circle cx="64" cy="40" r="8.5" fill="#000"/>
      <rect x="55.5" y="12" width="17" height="28" fill="#000"/>
    </mask>
  </defs>

  <rect width="128" height="128" rx="29" fill="url(#bg)"/>

  <!-- the slate -->
  <rect x="18" y="26" width="92" height="62" rx="8" fill="#0e1520"/>
  <rect x="24" y="32" width="80" height="50" rx="4" fill="#6f9bd1" opacity=".30"/>
  <rect x="10" y="92" width="108" height="9" rx="4.5" fill="#0e1520"/>

  <g transform="rotate(-35 64 62)">
    <rect width="128" height="128" fill="#f7b23b" mask="url(#wrench)"/>
  </g>
</svg>
