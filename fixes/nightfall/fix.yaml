id: nightfall
category: boot
name: Nightfall Boot Manager (touch boot, kernel install, backup)
risk: high
reverts_cleanly: true
applies_to:
  chromebook: true
  product: "nocturne"
description: |
  On a tablet with no attached keyboard, GRUB's menu cannot be navigated. The
  machine boots whatever the default entry is, and picking anything else means
  finding a keyboard - so in practice you never pick anything else. Anything
  that goes wrong below the desktop has the same problem: no menu, no shell,
  no way in.

  Nightfall Boot Manager (formerly nocturne-boot-picker) is a TWRP-style touch
  environment for exactly that situation. A small dedicated kernel and
  initramfs that GRUB hands control to, with real touch and DRM drivers, which
  reads the live grub.cfg and gives you:

    * boot any kernel it finds, by tapping it
    * edit a kernel's command line - for one boot, or remembered for every boot
    * set which kernel is the default
    * install a kernel from a tarball, and remove ones you no longer want
    * back the system up to an external drive, and restore it again
    * a repair menu, for when the installed system will not come up

  It is not a bootloader replacement. GRUB stays completely unmodified: the
  entry lives in /boot/grub/custom.cfg, no existing entry moves, and
  update-grub is never run. Installing and removing kernels happens with the
  root filesystem not in use - no package manager holding locks, no running
  kernel having its own modules replaced underneath it.

  Both the pre-rename and post-rename layouts are recognised, so detect,
  verify and revert keep working across that migration rather than reporting a
  working install as absent.

  This fix installs Nightfall itself, and nothing else. It builds no kernel and
  installs none: Nightfall reads the live grub.cfg, so kernels put there by
  anything else show up on their own, and installing kernels is something you
  then do from Nightfall rather than from here.
danger: |
  This writes a boot entry. On a machine with no keyboard, a boot problem is
  harder to escape than usual, so read this before applying.

  The entry is APPENDED and does not become the default - selecting it is a
  deliberate act. install-picker.sh refuses outright to run under
  GRUB_DEFAULT=saved, where booting the picker once would silently make it
  permanent. If you later set it as the default yourself, understand that a
  broken image then loops until you attach a keyboard.

  Nightfall falls back to booting the first discovered kernel if the display
  or touch fails, and on a timeout, so a failure is meant to be survivable
  rather than terminal. It has been run end-to-end on exactly one machine.

  Revert removes the entry and /boot/picker entirely and touches nothing else.
notes: |
  Needs the nightfall-boot-manager checkout and a prebuilt picker kernel image;
  apply says exactly what is missing and where it looked. Point it explicitly
  with FIXER_NIGHTFALL_REPO=/path and FIXER_NIGHTFALL_KERNEL=/path/to/vmlinuz.
  The pre-rename FIXER_PICKER_* spellings still work.

  The initramfs is built here at apply time, not shipped: it bundles the local
  busybox, kexec and the libraries the picker binary links against, so one
  built on another machine produces a picker that will not start.
