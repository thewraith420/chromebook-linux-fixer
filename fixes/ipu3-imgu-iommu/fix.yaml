id: ipu3-imgu-iommu
name: IPU3 ImgU IOMMU passthrough (prevents hard lockup)
risk: high
reverts_cleanly: true
applies_to:
  chromebook: true
description: |
  The staging ipu3-imgu driver bypasses the DMA API and programs the ImgU's own
  MMU with raw physical addresses. That is only valid when the device sits in an
  IOMMU identity/passthrough domain. In the kernel's default translated domain,
  VT-d re-translates those addresses, finds no mapping, and the machine HARD
  LOCKS on the ImgU's first DMA - no panic, no oops, nothing in the journal.

  Two remedies exist. The better one is a per-device passthrough quirk for PCI
  8086:1919 in the kernel, which needs no boot parameter at all, but requires a
  kernel rebuild (see kernel/README.md). The one this fix can apply is
  iommu=pt on the kernel command line, which is preferred over intel_iommu=off
  because it keeps the IOMMU enabled and protecting every other device.
danger: |
  THIS FIX ADDS A KERNEL COMMAND LINE PARAMETER AND REQUIRES A REBOOT.
  A malformed kernel command line can stop the machine booting. Every
  bootloader config is backed up first, and revert removes the parameter.
  Keep a second kernel installed as an escape route before applying.

  The fault this addresses is severe: on the reference hardware, streaming the
  ImgU without a passthrough domain locked the machine solid three times - no
  panic, no oops, nothing in the journal or pstore, a forced power-off each
  time, and one of those left the boot filesystem dirty.
notes: |
  If the kernel already carries the per-device quirk, this fix reports itself
  as not needed and does nothing.
