id: cros-fp-fingerprint
category: security
name: Fingerprint reader in the power button (ChromeOS FPMCU)
risk: medium
reverts_cleanly: true
applies_to:
  chromebook: true
description: |
  Chromebooks with a fingerprint reader expose it as a Chrome EC subdevice at
  /dev/cros_fp. The kernel side works out of the box - cros-ec-spi binds it and
  the MCU answers - but no Linux userspace can drive it: libfprint has no
  driver (the one public attempt is an abandoned skeleton with every method
  commented out), and ChromeOS uses its own biod daemon instead.

  GNOME decides whether to offer fingerprint unlock by asking fprintd over
  D-Bus for devices and enrolled fingers. That check happens before PAM is ever
  consulted, which is why replacing the PAM module alone does nothing.

  This installs a small daemon that speaks fprintd's D-Bus API and drives the
  MCU through rust-fp's cros_fp driver. GNOME, GDM and the lock screen then
  work unmodified, because as far as they can tell they are talking to fprintd.

  Includes two upstream fixes found while building this:
    - crosec-rs computed template upload chunk *size* from the EC's response
      limit but chunk *count* from its request limit. When those differ it
      sends the wrong number of chunks, still flags the last one as commit, and
      the MCU fails to decrypt a partial buffer - EC_RES_UNAVAILABLE. Template
      upload never worked, so matching only ever succeeded immediately after
      enrolment, when the template was already resident on the MCU.
    - rust-fp's upload path retries transient Busy/Unavailable rather than
      panicking on an unwrap.

  Two more additions on top of the working sensor:

    - The daemon now watches for its caller's D-Bus connection disconnecting
      without an explicit Release, and releases the claim on its behalf. A
      client that crashes, gets killed, or otherwise vanishes mid-verify would
      otherwise leave the sensor claimed forever, refusing every later Claim -
      including GNOME's own, at the very next lock screen.
    - A systemd-sleep hook arms the sensor in Match mode just before suspend
      and cleans up just after, so a touch while asleep wakes the machine -
      the sensor's own ACPI and kernel wakeup attributes are already enabled
      on this hardware, but nothing scans for a touch during suspend unless
      something explicitly arms it first. Confirmed working: the machine
      wakes on a touch, and GNOME's own post-resume lock-screen verify then
      matches again roughly a second later, which in practice reads as one
      continuous touch-and-unlock. Whether a finger already resting on the
      sensor at wake counts as a fresh touch for that second verify, or needs
      to be lifted and pressed again, has only been observed on one machine.
    - rust-fp's upload path retries transient Busy/Unavailable rather than
      panicking on an unwrap.
danger: |
  Masks fprintd and takes over its D-Bus name, because only one process can own
  it. Real fprintd has no driver for this sensor, so nothing is lost - but any
  USB fingerprint reader you plug in later will stop being handled until you
  revert this.

  Fingerprint is an additional path GDM tries, never a replacement: pam_fprintd
  appears only in /etc/pam.d/gdm-fingerprint, not in common-auth. If the daemon
  is stopped, broken, or the scan fails, you get the password prompt. This
  cannot lock you out.

  Builds from source and needs a Rust toolchain (~300MB via rustup if absent).

  The suspend hook runs as root on every suspend, unconditionally arming the
  sensor for whichever user has the active graphical session. It only arms
  Match mode against that user's own enrolled templates and cleans up on
  resume; it does not change who can authenticate as whom.
