[package]
name = "fprintd-shim"
version = "0.1.0"
edition = "2021"

[dependencies]
zbus = "4.3.1"
async-std = { version = "1.12.0", features = ["attributes"] }
futures = "0.3.30"
rmp-serde = "1.3.0"
log = "0.4.22"
simple_logger = "5.0.0"
rust-fp = { path = "../rust-fp/rust-fp" }
rust-fp-common = { path = "../rust-fp/common" }

[[bin]]
name = "fprintd-shim"
path = "src/main.rs"

# Same fix as rust-fp's manifest: cargo only honours [patch] from the root
# manifest of the workspace being built, and this is a separate workspace.
[patch."https://github.com/ChocolateLoverRaj/crosec-rs/"]
crosec = { path = "../crosec-rs/crosec" }
