id: display-autorotate
name: Automatic screen rotation from the accelerometer
risk: low
reverts_cleanly: true
applies_to:
  chromebook: true
description: |
  GNOME rotates the screen only when mutter believes the machine is in tablet
  mode, which requires a tablet-mode switch that many convertibles either lack
  or report in a way mutter rejects. Where that happens the display never
  rotates and no user-facing setting fixes it.

  Installs a small user service that reads the accelerometer from
  iio-sensor-proxy and rotates the built-in display through mutter's
  DisplayConfig interface. Both are ordinary D-Bus calls, so this needs no
  GNOME Shell extension - and therefore does not break when the shell's
  extension API changes.

  Honours the existing orientation-lock setting, so the lock control in Quick
  Settings keeps working, and releases the accelerometer while locked so the
  sensor can power down.

  GNOME Camera (Snapshot) additionally pins the screen to landscape while it is
  open, so the preview fills the screen instead of showing a sideways picture
  in an upright window - a camera sensor is fixed to the chassis, so it cannot
  follow the display. Auto-rotation is untouched the rest of the time: the
  orientation lock is taken only for the life of that window, restored when it
  closes, and restored again if this service exits while holding it.

  Landscape is derived from the panel's own mode rather than assumed to be
  transform 0, since several Chromebook tablets ship portrait-native panels.
  Detection is by the bus name the application owns, so it costs nothing while
  idle. Override the list with CHROMEBOOK_HOLD_LANDSCAPE (comma-separated bus
  names, empty to disable).

  Where mutter already rotates the panel itself - it reports
  PanelOrientationManaged - this service does not rotate as well, which would
  put two controllers on one display. It provides only the landscape hold,
  which mutter has no equivalent for.
danger: |
  If a GNOME extension on this machine already does auto-rotation, both will
  drive the display independently. Disable one of them.
