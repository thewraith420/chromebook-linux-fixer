id: nightfall-default
category: boot
name: Boot straight into Nightfall (make it the default GRUB entry)
risk: high
reverts_cleanly: true
applies_to:
  chromebook: true
  product: "nocturne"
prefers:
  - nightfall
description: |
  Installing Nightfall adds it to the GRUB menu but leaves it as something you
  select. This makes it the entry GRUB boots on its own, so the touch menu is
  what the machine comes up in rather than something you have to reach a
  keyboard to choose.

  It deliberately will not offer itself until Nightfall has demonstrably
  worked on this machine. "Demonstrably" means one specific thing, read out of
  Nightfall's own boot log: a boot that completed normally AND where the kernel
  was chosen by a tap rather than by the timeout. The timeout fires whether or
  not the panel ever lit, so a timed-out boot proves nothing about the display
  or the touchscreen. A tap proves both, and proves a person was able to use
  it.

  Until then the fix reports why not, and Apply stays greyed out.
danger: |
  This is the most consequential change in this repository, because of what it
  does when it is wrong.

  With no keyboard attached, GRUB's own menu cannot be navigated. If Nightfall
  is the default and its image is broken, the machine boots into something you
  cannot drive and cannot escape without finding a keyboard. That is why this
  waits for evidence rather than a checkbox.

  Two things make it survivable rather than terminal. Nightfall falls back to
  booting the first discovered kernel if its display or touch fail, and again
  on its own timeout - so a broken picker still reaches an OS. And revert puts
  GRUB_DEFAULT back exactly as it was, from a backup taken before the change.

  Rebuilding Nightfall's initramfs while it is the default is the risky
  sequence: the new image is untested and already in the boot path. Check
  `chromebook-fixer logs nightfall` after the first boot on a new image.
notes: |
  Writes GRUB_DEFAULT in /etc/default/grub and runs update-grub. Nothing else
  in the boot configuration is touched, and Nightfall's own entry in
  custom.cfg is not regenerated by update-grub.

  If GRUB_DEFAULT was set to 'nightfall' by hand, verify reports exit 3 - the
  state is right, but this fix is not what achieved it, so there is nothing
  here to revert.
