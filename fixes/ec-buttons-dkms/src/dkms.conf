PACKAGE_NAME="cros-ec-evpoll"
PACKAGE_VERSION="1.0"

BUILT_MODULE_NAME[0]="cros-ec-evpoll"
# Land in updates/dkms, which depmod ranks above the in-tree modules.
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Rebuild automatically on kernel updates. Detect a clang/LTO-built target
# kernel and pass LLVM=1 so the module is built with the matching toolchain;
# a stock gcc distro kernel needs nothing extra.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build $(grep -q '^CONFIG_CC_IS_CLANG=y' ${kernel_source_dir}/.config 2>/dev/null && echo LLVM=1) modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

AUTOINSTALL="yes"
