id: audio-avs-dsp
category: audio
name: Speaker audio via the AVS DSP driver (Skylake/Kaby Lake/Apollo Lake)
risk: medium
reverts_cleanly: true
applies_to:
  chromebook: true
description: |
  On the Chromebook generations the AVS driver covers - Skylake, Kaby Lake and
  Apollo Lake - the kernel's default audio-DSP driver selection often lands on
  SOF or the legacy driver, neither of which has a working machine driver for
  these boards' speaker amps (for example the MAX98373 on Google Nocturne /
  Pixel Slate). The result is silent speakers even though the hardware is fine.

  Forcing the Intel AVS driver (snd-intel-dspcfg dsp_driver=4) loads the AVS
  machine drivers instead, and audio works. Two companion options go with it:
  the shipped firmware does not match the version the driver expects, and the
  ALSA UCM profiles for these boards are written against the old card names.

  Gemini Lake is deliberately NOT covered. It is a SOF platform - the kernel
  has SND_SOC_SOF_GEMINILAKE and no AVS machine driver for it - so forcing AVS
  there selects a driver that cannot drive the board.
danger: |
  BOARDS WITH A MAX98357A AMP: the AVS path has no volume limiter, and driving
  that amp too loud can PERMANENTLY DAMAGE THE SPEAKERS. On those boards this
  fix moves the max98357a topology file aside so the speakers stay silent -
  headphones and HDMI are unaffected - and revert puts it back. Setting
  FIXER_ALLOW_MAX98357A_SPEAKERS=1 enables them anyway, at your own risk. The
  Pixel Slate is not affected: it uses a MAX98373.

  Forcing a DSP driver is only correct for the platforms AVS covers. Detection
  refuses to offer this unless the audio controller is one of those AND there is
  no working analog output already - so it never overrides a setup where sound
  works. Applied to the wrong hardware it could break working audio, which is
  why the detect is symptom-gated. Revert removes the option and rebuilds the
  initramfs.
notes: |
  Requires a reboot to take effect. dsp_driver values: 1=legacy, 3=SOF, 4=AVS.
  Confirmed on Google Nocturne (Pixel Slate, MAX98373). The audio-controller
  PCI-ID allow-list in detect.sh can be extended as boards are verified.

  The MAX98357A hazard, the two snd-soc-avs options and the Gemini Lake
  correction all come from reading WeirdTreeThing/chromebook-linux-audio, which
  supports far more boards than this fix does. If that script has already
  configured the machine, detect stands down and verify reports exit 3 rather
  than fighting it. Its ALSA UCM configs and WirePlumber headroom setting are
  NOT reproduced here.

  If this machine already has working audio via an edit to
  /etc/modprobe.d/alsa-base.conf, be aware that file is a package conffile:
  the next alsa-base upgrade will prompt about the conflict, and choosing the
  package version silently removes the option and kills audio again. Moving
  the line into this fix's own file avoids that trap.
