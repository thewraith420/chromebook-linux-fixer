id: audio-avs-driver
name: Speakers and microphone (Intel AVS audio)
risk: low
reverts_cleanly: true
applies_to:
  chromebook: true
description: |
  Several Chromebooks pair an Intel Skylake/Kabylake DSP with I2S codecs
  (max98373, max98357a, rt5663, da7219 and friends) plus digital microphones.
  Linux can drive that DSP with either the SOF or the AVS driver, and
  snd-intel-dspcfg picks automatically - on these machines it picks SOF, which
  has no topology for the hardware, so nothing appears and there is no sound.

  Forcing the AVS driver makes the codecs enumerate: cards appear as
  avs_max98373, avs_dmic and avs_hdaudio, and speakers, microphone and HDMI
  audio all work.

  The option is written to its own file in /etc/modprobe.d rather than added to
  alsa-base.conf, which is a package conffile: editing that one produces an
  upgrade prompt, and answering it the obvious way silently breaks audio again.
danger: |
  Takes effect at module load, so audio stays broken until you reboot.

  If your machine is one where SOF is the correct choice, forcing AVS will take
  working audio away. Detection only offers this where no AVS card is present
  and the DSP is an Intel one, but it cannot be certain your codec is supported
  by AVS. Revert restores automatic selection.
